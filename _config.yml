# PolaZhenjing v2 — Jekyll Configuration
# Deployed via GitHub Actions
title: PolaZhenjing
description: "织梦空间的 AI 文章库，记录 AI 产品、Agent、企业服务、工程实践和长期思考。"
url: "https://PolarisW007.github.io"
baseurl: "/PolaZhenJing"
author: PolaZhenjing
lang: zh_CN
locale: zh_CN
logo: "/assets/images/test_cover.jpg"
image: "/assets/images/test_cover.jpg"
twitter:
  username: PolarisW007
social:
  name: 炽驹 Polaris
  links:
    - https://aipd.me/

# Build
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
timezone: Asia/Shanghai

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate

# Defaults
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "deep-technical"

# Exclude from build
exclude:
  - app/
  - data/
  - wiki.py
  - requirements.txt
  - Gemfile
  - Gemfile.lock
  - PRD.md
  - pola-wukong-ui/
  - 案例/
  - .env
  - .env.example
  - "*.py"
  - __pycache__/
  - .venv/
  - node_modules/
