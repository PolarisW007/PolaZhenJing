{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<h2>登录</h2>
<form method="POST">
  <input type="hidden" name="next" value="{{ next_url }}">
  <div class="form-group">
    <label for="username">用户名或邮箱</label>
    <input type="text" id="username" name="username" class="form-input" required autofocus>
  </div>
  <div class="form-group">
    <label for="password">密码</label>
    <input type="password" id="password" name="password" class="form-input" required>
  </div>
  <button type="submit" class="btn-gold">登录</button>
</form>
{% if third_party_providers %}
<div class="auth-divider"><span>快捷验证登录</span></div>
<div class="provider-grid" aria-label="第三方快捷登录">
  {% for item in third_party_providers %}
  <a class="provider-button provider-{{ item.provider }}" href="{{ url_for('auth.third_party_start', provider=item.provider, next=next_url) }}">
    <span class="provider-mark">{{ item.label[:1] }}</span>
    <span>{{ item.label }}</span>
  </a>
  {% endfor %}
</div>
{% endif %}
<div class="form-links">
  <a href="{{ url_for('auth.register', next=next_url) }}">没有账号？去注册</a>
</div>
{% endblock %}
