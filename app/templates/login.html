{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block head_extra %}
{% if captcha_config.enabled %}
<script>
  window.AliyunCaptchaConfig = {
    region: {{ captcha_config.region | tojson }},
    prefix: {{ captcha_config.prefix | tojson }},
  };
</script>
<script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
{% endif %}
{% endblock %}
{% block content %}
<h2>登录</h2>
<form method="POST">
  <input type="hidden" name="next" value="{{ next_url }}">
  <div class="form-group">
    <label for="username">用户名或邮箱</label>
    <input type="text" id="username" name="username" class="form-input" autocomplete="username" required autofocus>
  </div>
  <div class="form-group">
    <label for="password">密码</label>
    <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" required>
  </div>
  <button type="submit" class="btn-gold">登录</button>
</form>

{% include "_auth_quick_methods.html" %}

<div class="form-links">
  <a href="{{ url_for('auth.register', next=next_url) }}">没有账号？去注册</a>
</div>
{% endblock %}
